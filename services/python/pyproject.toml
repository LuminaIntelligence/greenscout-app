# GreenScout Python service tool configuration.
# Dependencies live in requirements.txt / requirements-dev.txt (CLAUDE.md §2 pin: pip + venv).
# This file is tool-config only — no [project] block, no wheel build.

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = [".venv", "build", "dist"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "PT", "RUF", "SIM", "TCH"]

[tool.ruff.lint.per-file-ignores]
# F401 unused imports OK in __init__.py (re-export pattern).
"__init__.py" = ["F401"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.pyright]
include = ["app", "tests"]
exclude = [".venv", "**/__pycache__"]
# Pyright resolves third-party imports from this venv (project-local).
# Both fields are required; absence of either causes "Import ... could not be resolved".
venvPath = "."
venv = ".venv"
# Defekt CI-0 (2026-05-31): single-file pyright invocations (e.g. via
# lint-staged on staged *.py files) lose the project-root context that
# normally lets `from app.x import y` resolve. Adding the project root
# as an extraPath fixes both single-file AND full-project runs without
# needing an editable install. `.` resolves relative to this
# pyproject.toml, i.e. services/python — exactly the cwd from which
# `from app...` should resolve.
extraPaths = ["."]
pythonVersion = "3.12"
typeCheckingMode = "strict"
reportMissingImports = "error"
reportGeneralTypeIssues = "error"

# Defekt CI-0 (2026-05-31): Tests run with loosened strict-mode checks.
# FastAPI's TestClient (via httpx) returns Unknown-typed responses, which under
# strict mode floods the test suite with reportUnknownMemberType / -VariableType /
# -ArgumentType noise — no real safety benefit in test code. Pyright version pinned
# in requirements-dev.txt for additional drift protection.
[[tool.pyright.executionEnvironments]]
root = "tests"
reportUnknownMemberType = "none"
reportUnknownVariableType = "none"
reportUnknownArgumentType = "none"
reportUnknownParameterType = "none"
reportMissingTypeArgument = "none"
# Tests legitimately access module-private helpers (`_build_context`,
# `_format_currency_eur` etc.) — the leading underscore is a "do not
# import from outside the module" hint for production code, NOT a
# barrier to whitebox unit tests of the same package.
reportPrivateUsage = "none"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "auto"
addopts = "-ra -q"
